<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחר זה קורה!</title>
<style>
  :root {
    --glow: #b06bff;
    --gold: #fff9eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0620;
    font-family: "Calibri", "Segoe UI", sans-serif;
    color: var(--gold);
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
  }
  .page {
    width: 100%;
    max-width: 560px;
  }
  .hero {
    position: relative;
    width: 100%;
    line-height: 0;
  }
  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }
  @media (max-width: 768px) {
    .hero {
      height: 100vh;
      height: 100dvh;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
  }
  .overlay {
    position: absolute;
    top: 27.5%;
    left: 0;
    width: 100%;
    z-index: 2;
    text-align: center;
    padding: 0 4%;
  }
  .countdown {
    display: inline-block;
    margin-top: 2.5%;
    background: rgba(30, 10, 60, 0.55);
    border: 1px solid rgba(176, 107, 255, 0.6);
    border-radius: 12px;
    padding: 2.2% 5%;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 18px rgba(176, 107, 255, 0.45);
    direction: ltr;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.6rem, 8vw, 3rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: clamp(0.8rem, 3.3vw, 1.1rem);
    opacity: 0.9;
    margin: 0;
    text-shadow: 0 0 10px rgba(176, 107, 255, 0.8), 0 2px 4px rgba(0,0,0,0.6);
  }
  .music-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(60, 10, 45, 0.75);
    border: 2px solid #ff3fa6;
    color: var(--gold);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 18px rgba(255, 63, 166, 0.6);
  }
  .music-btn:hover {
    background: rgba(90, 15, 65, 0.85);
  }
  .music-btn.pulse {
    animation: musicPulse 1.2s ease-in-out infinite;
  }
  @keyframes musicPulse {
    0%, 100% {
      box-shadow: 0 0 10px rgba(255, 63, 166, 0.55);
      border-color: rgba(255, 63, 166, 0.7);
    }
    50% {
      box-shadow: 0 0 30px 8px rgba(255, 63, 166, 0.95);
      border-color: #ff8fd0;
    }
  }
</style>
</head>
<body>

<button class="music-btn pulse" id="musicBtn" onclick="toggleMusic()">🎵 נגן מוזיקה</button>
<audio id="bgMusic" src="music.mp3" loop autoplay playsinline></audio>

<div class="page">
  <div class="hero">
    <img src="wedding-hero.png" alt="מחר זה קורה!">
    <div class="overlay">
      <p class="subtitle">הספירה לאחור התחילה</p>
      <div class="countdown" id="countdown">--:--:--</div>
    </div>
  </div>
</div>

<script>
  // deadline: tomorrow at 12:00 noon, local time
  var now = new Date();
  var deadline = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12, 0, 0);

  function updateCountdown() {
    var diff = deadline.getTime() - Date.now();
    if (diff <= 0) {
      document.getElementById('countdown').textContent = '00:00:00';
      document.querySelector('.subtitle').textContent = 'זה קורה עכשיו!';
      return;
    }
    var totalSeconds = Math.floor(diff / 1000);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    var hh = String(hours).padStart(2, '0');
    var mm = String(minutes).padStart(2, '0');
    var ss = String(seconds).padStart(2, '0');
    document.getElementById('countdown').textContent = hh + ':' + mm + ':' + ss;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  var audio = document.getElementById('bgMusic');
  var musicBtn = document.getElementById('musicBtn');

  audio.addEventListener('play', function () {
    musicBtn.textContent = '🔇 עצור מוזיקה';
    musicBtn.classList.remove('pulse');
  });
  audio.addEventListener('pause', function () {
    musicBtn.textContent = '🎵 נגן מוזיקה';
    musicBtn.classList.add('pulse');
  });

  function toggleMusic() {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  }

  // Most mobile browsers block autoplay with sound until the user
  // interacts with the page. If autoplay was blocked, start playback
  // on the very first tap/click/key press ANYWHERE OTHER THAN the
  // music button itself (the button already handles its own click,
  // and handling it here too caused a play/pause race that needed
  // several taps to settle).
  audio.play().catch(function () {
    function startOnFirstInteraction(e) {
      if (e.target.closest('#musicBtn')) return;
      audio.play();
      ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
        document.removeEventListener(evt, startOnFirstInteraction);
      });
    }
    ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
      document.addEventListener(evt, startOnFirstInteraction);
    });
  });
</script>

</body>
</html>
